<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bf5b0"/>
      <stop offset="1" stop-color="#a970ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#020406"/>
  <rect x="17" y="17" width="30" height="30" rx="2" transform="rotate(45 32 32)" fill="none" stroke="url(#g)" stroke-width="3.2" filter="url(#glow)"/>
  <rect x="27" y="27" width="10" height="10" rx="1" transform="rotate(45 32 32)" fill="#2bf5b0" filter="url(#glow)"/>
</svg>
